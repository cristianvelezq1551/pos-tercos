packages:
  - "apps/*"
  - "packages/*"

# --- Defensa de cadena de suministro ---
# La ola de ataques a npm (chalk/debug, el worm Shai-Hulud) funciona así: le
# roban la cuenta a un mantenedor, publican una versión con un postinstall
# malicioso y esa versión se instala sola en el próximo `pnpm install`. Casi
# siempre la detectan y despublican en horas.

# Ignora versiones publicadas hace menos de 7 días (en minutos). Se paga un
# retraso de una semana en updates a cambio de no ser paciente cero.
minimumReleaseAge: 10080

# Una dependencia transitiva no puede venir de un tarball o repo git arbitrario:
# solo del registry. Cierra el vector de "dep legítima que apunta a un fork".
blockExoticSubdeps: true

# Un paquete no puede rebajar la configuración de seguridad en una versión
# nueva (ej. re-habilitar scripts de instalación que acá están restringidos
# por `onlyBuiltDependencies` en package.json).
trustPolicy: no-downgrade
