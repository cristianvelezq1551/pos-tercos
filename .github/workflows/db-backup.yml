# Backup nocturno de Postgres (Railway) → Cloudflare R2.
#
# Un backup que nunca se probó restaurar NO es un backup: cada corrida
# verifica el dump (gunzip -t + pg_restore --list sobre formato custom)
# antes de subirlo, y el job falla ruidosamente si algo no cuadra.
#
# Secrets requeridos — van en el ENVIRONMENT `production-backup`, NO a nivel
# repositorio (Settings → Environments → production-backup → Secrets):
#   RAILWAY_DB_URL        — postgres://… de la DB de producción
#   R2_ACCOUNT_ID         — account de Cloudflare (7f706ea0…)
#   R2_ACCESS_KEY_ID      — credencial S3 del bucket
#   R2_SECRET_ACCESS_KEY  — credencial S3 del bucket
#   R2_BACKUP_BUCKET      — ej. pos-tercos-prod (prefijo backups/)
#   HEALTHCHECKS_URL      — opcional (dead-man's-switch)
#
# Por qué un Environment y no secrets del repo: estas son las credenciales más
# valiosas que existe (Postgres de PRODUCCIÓN + escritura en R2). Como secrets
# de repositorio los ve cualquier workflow de cualquier rama, y `workflow_dispatch`
# deja elegir el ref — así que bastaba empujar una rama con este archivo modificado
# para mandarse la DATABASE_URL a un host externo, sin tocar `main` jamás.
# El Environment cierra eso, pero SOLO si se completan estos 3 pasos a mano en
# GitHub. El YAML puede pedir el Environment, no configurarlo — y GitHub lo crea
# vacío (sin reglas) apenas lo referencia, así que sin esto no protege nada:
#   1. Settings → Environments → New environment → `production-backup`.
#   2. Deployment branches → "Selected branches" → solo `main`. ESTE es el
#      candado que importa: un dispatch desde otra rama no recibe los secrets.
#   3. Cargar los 6 secrets DENTRO del Environment, nunca en Settings → Secrets
#      → Actions. A nivel repo los lee cualquier workflow de cualquier rama y
#      el paso 2 se vuelve irrelevante.
#
# NO usar "Required reviewers" acá: esa regla aplica también al `schedule`, así
# que el backup de cada 6h quedaría esperando aprobación manual para siempre.
#
# Retención: 30 días por nombre de archivo (la limpieza corre acá mismo —
# R2 no tiene lifecycle rules gratuitas por prefijo).
name: Postgres backup

on:
  schedule:
    # Cada 6h (2 AM / 8 AM / 2 PM / 8 PM Colombia): acota la ventana máxima de
    # pérdida de datos a ~6h (Railway hobby no tiene PITR). El dump es chico y
    # GitHub Actions es gratis — no hay razón para conformarse con 24h.
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch: {} # corrida manual — gateada por el Environment (ver cabecera)

# Default a nivel WORKFLOW: cualquier job que se agregue acá abajo arranca en
# solo-lectura en vez de heredar el default read-write del repo. `ci.yml` ya lo
# hacía así; este archivo, que es el que tiene los secrets de prod, no.
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ⚠️ Esta línea SOLA no protege nada: GitHub crea el Environment al
    # referenciarlo, sin reglas. Lo que cierra el agujero es la config manual
    # (ver cabecera) — y sobre todo MOVER los secrets del repo al Environment.
    # Mientras sigan siendo secrets de repositorio, cualquier workflow de
    # cualquier rama los lee y esta línea es decorativa.
    environment: production-backup
    permissions:
      contents: read
      issues: write # requerido por el paso de alerta (github-script)
    steps:
      - name: Instalar cliente Postgres 16
        # El runner ubuntu-24.04 ya trae pg_dump 16 — apt es solo el respaldo.
        # Con timeout propio y reintentos: un mirror caído debe FALLAR rápido,
        # no colgar el job 15 min en silencio (pasó el 2026-08-19, run 32302621060).
        timeout-minutes: 4
        run: |
          if pg_dump --version 2>/dev/null | grep -Eq ' 1[6-9]| [2-9][0-9]'; then
            pg_dump --version
            echo "pg_dump ya presente en la imagen — se omite apt"
            exit 0
          fi
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 postgresql-client-16 \
            || sudo apt-get install -y -o Acquire::Retries=3 postgresql-client

      - name: Dump (formato custom, comprimido)
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DB_URL }}
        run: |
          STAMP=$(date -u +%F-%H%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # Formato custom (-Fc): permite restore selectivo por tabla y
          # pg_restore --list como verificación de integridad.
          pg_dump --format=custom --compress=6 --no-owner --no-privileges \
            --file="pos-tercos-$STAMP.dump" "$DATABASE_URL"
          ls -lh "pos-tercos-$STAMP.dump"

      - name: Verificar integridad del dump (restore --list)
        run: |
          # Si el dump está corrupto o vacío, esto falla y el job NO sube basura.
          TABLES=$(pg_restore --list "pos-tercos-$STAMP.dump" | grep -c 'TABLE DATA' || true)
          echo "Tablas con datos en el dump: $TABLES"
          if [ "$TABLES" -lt 10 ]; then
            echo "::error::El dump tiene menos de 10 tablas con datos — algo está mal."
            exit 1
          fi

      - name: Subir a R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          aws s3 cp "pos-tercos-$STAMP.dump" \
            "s3://$BUCKET/backups/pos-tercos-$STAMP.dump" \
            --endpoint-url "$R2_ENDPOINT"

      - name: Retención 30 días
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          CUTOFF=$(date -u -d '30 days ago' +%F)
          aws s3 ls "s3://$BUCKET/backups/" --endpoint-url "$R2_ENDPOINT" \
            | awk '{print $4}' \
            | while read -r key; do
                [ -z "$key" ] && continue
                FILE_DATE=$(echo "$key" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
                [ -z "$FILE_DATE" ] && continue
                if [[ "$FILE_DATE" < "$CUTOFF" ]]; then
                  echo "Borrando backup viejo: $key"
                  aws s3 rm "s3://$BUCKET/backups/$key" --endpoint-url "$R2_ENDPOINT"
                fi
              done

      # Dead-man's-switch OPCIONAL (healthchecks.io): el Issue de abajo avisa si
      # el backup FALLA, pero no si el cron NUNCA CORRIÓ (GitHub pausa schedules
      # en repos inactivos >60 días). Con el secret HEALTHCHECKS_URL configurado,
      # healthchecks.io espera este ping y alerta por su cuenta si no llega.
      - name: Ping dead-man's-switch
        if: success()
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS --retry 3 "$HC_URL" >/dev/null && echo "ping enviado"
          else
            echo "HEALTHCHECKS_URL no configurado — paso omitido (opcional)"
          fi

      # Un backup que falla EN SILENCIO se descubre el día que se necesita el
      # restore. Si cualquier paso falló, se abre (o comenta) un Issue — GitHub
      # manda mail al dueño del repo. Canal independiente de WhatsApp/Railway.
      - name: Alertar fallo (GitHub Issue)
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = '🔴 Backup nocturno de Postgres FALLÓ';
            const body = [
              `El workflow de backup falló el ${new Date().toISOString()}.`,
              '',
              `Corrida: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Revisar antes de que se acumulen días sin backup.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'backup-failure',
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issues[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['backup-failure'],
              });
            }
