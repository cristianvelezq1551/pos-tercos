# CI: typecheck + lint + tests unitarios + e2e (con Postgres real).
#
# Es la red de seguridad que faltaba: nada de esto corría automáticamente en
# push/PR. Un solo job porque la suite completa es rápida (~1-2 min). El e2e
# levanta la API real contra un Postgres de servicio; global-setup.ts crea y
# migra `pos_tercos_test`, las suites truncan entre sí (cleanDb).
name: CI

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # global-setup.ts deriva `pos_tercos_test` de esta URL (swap del path).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Secretos dummy (≥32 chars) solo para que la API arranque en los e2e.
      JWT_ACCESS_SECRET: ci-jwt-access-secret-not-for-production-0001
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-not-for-production-001
      WEB_ORDER_TOKEN_SECRET: ci-web-order-token-secret-not-for-prod-0001

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar Prisma Client
        run: pnpm -F @pos-tercos/api prisma:generate

      # Los e2e resuelven @pos-tercos/{types,domain} a dist/ (moduleNameMapper).
      # Construirlos explícito acá hace que el paso e2e no dependa del orden de
      # los otros pasos (antes solo existían como efecto colateral de turbo).
      - name: Build packages compartidos
        run: pnpm --filter @pos-tercos/types --filter @pos-tercos/domain build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests unitarios (domain + pos + api)
        run: pnpm test

      - name: Tests e2e (API + Postgres)
        run: pnpm -F @pos-tercos/api test:e2e

  # KDS Flutter: corre aparte (necesita el SDK de Flutter, no Node). Antes sus
  # 47 tests solo se corrían a mano → podía regresar sin que nadie lo notara.
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/kds-flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test
