<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KDS Tercos — Sin conexión</title>
<style>
  body {
    margin: 0; font-family: system-ui, sans-serif;
    background: #111827; color: #f9fafb;
    display: flex; min-height: 100vh; align-items: center; justify-content: center;
    padding: 2rem;
  }
  .card {
    max-width: 28rem; background: #1f2937; border: 1px solid #374151;
    border-radius: 0.75rem; padding: 2rem; text-align: center;
  }
  h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
  p { color: #9ca3af; line-height: 1.5; }
  button {
    margin-top: 1.5rem; padding: 0.75rem 1.5rem; background: #dc2626;
    color: #fff; border: 0; border-radius: 0.5rem; font-weight: 600;
    cursor: pointer; font-size: 1rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>KDS sin conexión</h1>
    <p>La pantalla de cocina necesita conexión con el backend para
       recibir nuevos pedidos. Verificá Wi-Fi y volvé a intentar.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
