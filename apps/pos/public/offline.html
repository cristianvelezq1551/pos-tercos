<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POS Tercos — Sin conexión</title>
<style>
  body {
    margin: 0; font-family: system-ui, sans-serif;
    background: #131822; color: #F1F5FA;
    display: flex; min-height: 100vh; align-items: center; justify-content: center;
    padding: 2rem;
  }
  .card {
    max-width: 30rem; background: #1D232E; border: 1px solid #2C3340;
    border-radius: 0.75rem; padding: 2rem; text-align: center;
  }
  h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
  p { color: #94A0B0; line-height: 1.55; }
  button {
    margin-top: 1.5rem; padding: 0.75rem 1.5rem; background: #E5293E;
    color: #fff; border: 0; border-radius: 0.5rem; font-weight: 600;
    cursor: pointer; font-size: 1rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Primer arranque sin conexión</h1>
    <p>Para habilitar el modo offline, abrí el POS <strong>con conexión al menos
       una vez</strong>. Después de eso vas a poder seguir vendiendo en mostrador
       aunque se caiga la red.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
